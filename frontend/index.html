<!doctype html>
<html lang="ru" data-theme="serika_dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Заголовок и описание здесь — заглушка для dev, где страницу раздаёт
         Vite. В продакшене бэкенд подменяет их на мета-данные конкретного
         маршрута: см. backend/app/core/seo.py -->
    <title>speedtype</title>
    <meta name="description" content="Тренажёр слепой печати: скорость, точность и статистика прогресса." />

    <meta name="theme-color" content="#323437" />

    <!-- Слой 1: десять переменных темы. Единственное место, где они
         объявлены — state/themes.ts переписывает содержимое этого тега
         при каждой смене темы, а файлы тем и funbox подключаются ниже
         и могут его перебить.

         Значения — serika_dark: она стоит по умолчанию, и до ответа
         сервера страница рисуется ею, а не голым html. В css этих
         переменных нет намеренно: оттуда они перебивали тему. -->
    <style id="themeColors">
      :root {
        --bg-color: #323437;
        --main-color: #e2b714;
        --caret-color: #e2b714;
        --sub-color: #646669;
        --sub-alt-color: #2c2e31;
        --text-color: #d1d0c5;
        --error-color: #ca4754;
        --error-extra-color: #7e2a33;
        --colorful-error-color: #ca4754;
        --colorful-error-extra-color: #7e2a33;
      }
    </style>

    <!-- svg первым и без растрового запасного варианта рядом: при двух
         объявлениях браузер брал favicon.ico, а он нарисован другой
         клавиатурой и не перекрашивается под тему. Тег живёт до первой
         смены темы, дальше state/themes.ts заводит свой. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Интерфейс русский, логотип латиницей — эти два подмножества нужны
         всегда, поэтому запрашиваем их сразу, не дожидаясь вёрстки.
         crossorigin обязателен даже для своего домена: без него браузер
         скачает файл дважды. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/roboto-mono-cyrillic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/roboto-mono-latin.woff2" crossorigin />

    <!-- Шрифт лежит локально и описан прямо здесь. Раньше css приезжал
         с fonts.googleapis.com и блокировал отрисовку на 996 мс (Lighthouse);
         отдельный файл стоил бы лишнего запроса, поэтому правила встроены.
         Файлы обновляются скриптом из scratchpad/fetch_font.py.
         Roboto Mono — Apache License 2.0. -->
    <style>
      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url(/fonts/roboto-mono-cyrillic-ext.woff2) format('woff2');
        unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url(/fonts/roboto-mono-cyrillic.woff2) format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url(/fonts/roboto-mono-greek.woff2) format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url(/fonts/roboto-mono-vietnamese.woff2) format('woff2');
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url(/fonts/roboto-mono-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url(/fonts/roboto-mono-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
